<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- sin zoom del navegador: el zoom de la hoja lo maneja la app (pellizco con dos dedos) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f5fd1">
<!-- app web instalable (iPad: Compartir → Añadir a pantalla de inicio · Android: menú → Instalar app) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CalcInk">
<title>CalcInk</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/math.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/perfect-freehand.js"></script>
<style>
:root{
  --bg:#e9ebef; --chrome:#f7f8fa; --chrome-2:#ffffff; --chrome-3:#eef0f3; --line:#dcdfe5; --line-2:#c9cdd5; --text:#1b1f27; --muted:#636a78;
  --accent:#1f5fd1; --accent-2:#1849a8; --accent-soft:#e3ebfb; --danger:#d0342c; --ok:#1d8a4e;
  --appbar:#ffffff; --sidebar:#f2f3f6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.10);
  --shadow-sm:0 1px 2px rgba(16,24,40,.08);
  --r:8px;
}
body.dark{
  --bg:#101216; --chrome:#191c22; --chrome-2:#23272e; --chrome-3:#1e2127; --line:#2e333c; --line-2:#3c424d; --text:#e6e8ec; --muted:#9aa1ad;
  --accent:#7aa2ff; --accent-2:#a2bdff; --accent-soft:#223152; --ok:#4fc483;
  --appbar:#15181d; --sidebar:#16191e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);background:var(--bg);color:var(--text);
  font:13px/1.35 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}

/* ---------- barra de aplicación ---------- */
#appbar{display:flex;align-items:center;gap:6px;height:48px;padding:0 10px 0 8px;background:var(--appbar);border-bottom:1px solid var(--line);
  user-select:none;-webkit-user-select:none;position:relative;z-index:11;min-width:0}
.logo-btn{border:0;background:none;padding:4px;border-radius:9px;cursor:pointer;flex:none}
.logo-btn:hover{background:var(--chrome-3)}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2f7cf6,#1846b8);color:#fff;display:grid;place-items:center;
  font:700 17px/1 Georgia,serif;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.doc-id{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:0 6px 0 2px;margin-right:4px}
#docTitle{width:210px;max-width:28vw;border:1px solid transparent;background:none;border-radius:6px;padding:1px 5px;font-weight:600;font-size:14px}
#docTitle:hover,#docTitle:focus{border-color:var(--line);background:var(--chrome-2);outline:none}
#saveState{font-size:11px;color:var(--muted);padding:0 6px;white-space:nowrap}
#saveState.dirty::before{content:"●";color:#d79b00;margin-right:4px;font-size:9px;vertical-align:1px}
#saveState.saved::before{content:"✓";color:var(--ok);margin-right:4px}
.ab-grp{display:flex;align-items:center;gap:1px;padding:0 6px;border-left:1px solid var(--line);flex:none}
.ab-spacer{flex:1;min-width:8px}
.pagenav #pageInfo{min-width:54px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.zoomctl{gap:0}

/* ---------- barra de herramientas (agrupada, estilo Xournal++) ---------- */
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:5px 8px;background:var(--chrome);
  border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;position:relative;z-index:10}
.grp{display:flex;align-items:center;gap:1px;padding:2px;border-radius:10px;background:var(--chrome-3);border:1px solid var(--line)}
.grp:empty,.grp.all-hidden{display:none}
.tb{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;border-radius:7px;background:none;cursor:pointer;padding:0;color:var(--text);
  transition:background .12s,color .12s,border-color .12s}
.tb.sm{width:30px;height:30px}
.tb:hover{background:var(--chrome-2);border-color:var(--line)}
.tb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
body.dark .tb[aria-pressed="true"]{color:#0d1424}
#appbar .tb[aria-pressed="true"],#toolbar .tb[data-toggle][aria-pressed="true"],#toolbar [data-act][aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);box-shadow:none}
.tb.rec-on{color:#fff;background:var(--danger);border-color:var(--danger);animation:recPulse 1.4s ease-in-out infinite}
@keyframes recPulse{50%{box-shadow:0 0 0 4px rgba(208,52,44,.25)}}
.tb:disabled{opacity:.35;cursor:default}
.tb:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tb[data-hidden]{display:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.sm .ic{width:18px;height:18px}

/* ---------- barra de propiedades de la herramienta ---------- */
#propbar{display:flex;align-items:center;gap:8px;min-height:40px;padding:3px 10px;background:var(--chrome-2);border-bottom:1px solid var(--line);
  user-select:none;-webkit-user-select:none;position:relative;z-index:9;overflow-x:auto;scrollbar-width:thin}
#toolChip{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  padding-right:10px;border-right:1px solid var(--line);white-space:nowrap;flex:none}
#toolChip .ic{width:16px;height:16px;color:var(--accent)}
#toolOpts{display:flex;align-items:center;gap:4px 6px;flex-wrap:nowrap;min-width:0}
#toolOpts .grp{background:none;border:0;padding:0}
#toolOpts>*{flex:none}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line);cursor:pointer;margin:0 2px;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sel-in{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--chrome-2);padding:0 6px}
.hint{color:var(--muted);font-size:12px;padding:0 4px;white-space:nowrap}
.rng-wrap{display:inline-flex;align-items:center;gap:4px;padding:0 4px}
.rng{width:86px;accent-color:var(--accent);cursor:pointer}
.rng-val{font-size:11px;color:var(--muted);min-width:44px;font-variant-numeric:tabular-nums}
.sw-add{width:22px;height:22px;border:1.5px dashed var(--muted);border-radius:50%;padding:1px;background:none;cursor:pointer;margin:0 3px}
.sw-add::-webkit-color-swatch-wrapper{padding:0}
.sw-add::-webkit-color-swatch{border:0;border-radius:50%}
.fav{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--chrome-2);cursor:pointer;padding:0;margin-left:2px}
.fav:hover{border-color:var(--accent)}
#zoomLbl{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer;border:0;background:none}

/* ---------- área de trabajo ---------- */
#main{position:relative;display:flex;min-height:0}
#viewport{flex:1;min-width:0;overflow:auto;position:relative}
body[data-tool="hand"] #viewport .page{cursor:grab}
body.panning #viewport .page{cursor:grabbing}
#pages{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 16px 90px;min-width:min-content}

/* panel lateral de páginas y capas (como en Xournal++) */
#sidebar{width:200px;flex:none;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--line);min-height:0;user-select:none;-webkit-user-select:none}
#sidebar[hidden]{display:none}
.sb-tabs{display:flex;gap:2px;margin:8px;padding:3px;border-radius:9px;background:var(--chrome-3);border:1px solid var(--line)}
.sb-tab{flex:1;border:0;background:none;padding:5px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px}
.sb-tab.on{background:var(--chrome-2);color:var(--text);box-shadow:var(--shadow-sm)}
.sb-body{flex:1;overflow:auto;padding:2px 8px 12px;min-height:0}
.sb-body[hidden]{display:none}
.sb-page{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 6px 6px;border-radius:9px;cursor:pointer;touch-action:pan-y;border:1px solid transparent}
.sb-page:hover{background:var(--chrome-3)}
.sb-page.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.sb-page.dragging{opacity:.35}
.sb-thumb{position:relative;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);border-radius:2px;flex:none}
.sb-page.on .sb-thumb{box-shadow:0 0 0 2px var(--accent),0 1px 3px rgba(0,0,0,.18)}
.sb-thumb .page{box-shadow:none!important;pointer-events:none}
.sb-thumb .crosshair,.sb-thumb .sel-tools,.sb-thumb .overlay,.sb-thumb .grip,.sb-thumb .msg{display:none!important}
.sb-thumb .region{border-color:transparent!important;background:transparent!important}
.sb-num{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.sb-num .tag{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--chrome-2)}
.sb-more{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--chrome-2);cursor:pointer;
  display:grid;place-items:center;opacity:0;box-shadow:var(--shadow-sm);padding:0;font-size:16px;line-height:1;color:var(--text)}
.sb-page:hover .sb-more,.sb-page.on .sb-more{opacity:1}
@media (pointer:coarse){.sb-more{opacity:1}}
.sb-drop{height:3px;background:var(--accent);border-radius:2px;margin:1px 10px}
.sb-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:6px;border:1.5px dashed var(--line-2);border-radius:9px;background:none;
  padding:9px;cursor:pointer;color:var(--muted)}
.sb-add:hover{border-color:var(--accent);color:var(--accent)}
.sb-add .ic{width:17px;height:17px}
.sb-sec{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:12px 4px 6px}
#sbLayers .layer-row{padding:3px 4px;border-radius:7px}
#sbLayers .layer-row:hover{background:var(--chrome-3)}
#sbLayers .tb{width:30px;height:30px}
.pg-sizes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bg-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0}
.bg-opt{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:var(--chrome);border-radius:8px;padding:5px 3px;cursor:pointer;font-size:10.5px;color:var(--muted)}
.bg-opt svg{width:44px;height:56px;background:#fff;border:1px solid #dfe3ea;border-radius:2px}
.bg-opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.page-holder{position:relative;flex:none}
.page{position:absolute;left:0;top:0;width:793.7px;height:1122.5px;background:#fff;box-shadow:var(--shadow);
  transform-origin:0 0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;color:#1d2129}
.page>svg{position:absolute;inset:0;width:100%;height:100%}
.page .bg{z-index:0}
.page .regions{position:absolute;inset:0;z-index:1}
.page .ink{z-index:2;pointer-events:none}
.page .overlay{z-index:3;pointer-events:none}
.page .hl{mix-blend-mode:multiply}
.page-num{position:absolute;left:0;right:0;bottom:-21px;text-align:center;font-size:11px;color:var(--muted)}
body[data-tool="pen"] .page,body[data-tool="highlighter"] .page,body[data-tool="line"] .page,body[data-tool="arrow"] .page,
body[data-tool="rect"] .page,body[data-tool="dimension"] .page,body[data-tool="support"] .page{cursor:crosshair}
body[data-tool="text"] .page{cursor:text}
body[data-tool="label"] .page{cursor:copy}
body[data-tool="eraser"] .page{cursor:cell}

/* regiones matemáticas y de texto */
.region{position:absolute;transform-origin:0 0;font-size:13px;padding:2px 4px;border:1px solid transparent;border-radius:3px;
  white-space:nowrap;min-height:20px;min-width:14px}
body[data-tool="select"] .region,body[data-tool="text"] .region{cursor:text}
body[data-tool="select"] .region:hover,body[data-tool="text"] .region:hover{border-color:#c4d3f3}
.region .grip{position:absolute;left:-15px;top:2px;width:13px;height:18px;border-radius:3px;cursor:move;opacity:0;color:#6c7586;
  font-size:11px;line-height:18px;text-align:center;letter-spacing:-2px}
body[data-tool="select"] .region:hover .grip,body[data-tool="text"] .region:hover .grip,.region.editing .grip{opacity:1;background:#eef3fd}
.region .src{display:none;font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;border:0;outline:0;background:#fff7cf;
  padding:1px 4px;color:#1d2129;border-radius:2px}
.region.editing{border-color:#1f5fd1;background:#fff;z-index:2}
.region.editing .src{display:block}
.region.editing .view{opacity:.75;margin-top:3px;padding-top:3px;border-top:1px dotted #c4d3f3}
.region .msg{display:none;color:#c0281f;font-size:11px;margin-top:2px;white-space:normal;width:max-content;max-width:75mm}
.region.has-error{border:1px dashed #d0342c;background:#fff4f3}
.region.has-error .msg{display:block}
.region.dim-error{border-color:#d17a00;background:#fff7e8}
.region.dim-error .msg{color:#a65f00}
.region.text .txt{outline:0;white-space:pre-wrap;font-size:14px;min-width:12px;min-height:1.3em}
.region.text.bold .txt{font-weight:700;letter-spacing:.2px}
.region.text.fixedw{white-space:normal}
.region.text .txt b{font-weight:700}
.region .wgrip{position:absolute;right:-4px;top:0;bottom:0;width:7px;cursor:ew-resize;display:none;touch-action:none}
body[data-tool="select"] .region.text:hover .wgrip,body[data-tool="text"] .region.text:hover .wgrip,.region.text.editing .wgrip{display:block}
.region .wgrip::after{content:"";position:absolute;left:2px;top:50%;width:3px;height:14px;margin-top:-7px;border-radius:2px;background:#9db4e6}
.region.text.fixedw.editing{box-shadow:inset -1px 0 0 #9db4e6}
#toolOpts .tb.fmt{font:15px/1 Georgia,serif;width:30px;height:30px}
#toolOpts .grp{display:flex;gap:1px;align-items:center}
.font-sel{max-width:170px}
.region.text.editing{background:#fffdf2}
.crosshair{position:absolute;width:15px;height:15px;margin:-7px 0 0 -7px;pointer-events:none;z-index:4}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:#d0342c}
.crosshair::before{left:6.5px;top:0;width:2px;height:15px}
.crosshair::after{top:6.5px;left:0;height:2px;width:15px}
.ink text{font-family:KaTeX_Main,"Times New Roman",serif}
body[data-tool="select"] .ink .lbl,body[data-tool="select"] .ink .dimtext,
body[data-tool="label"] .ink .lbl,body[data-tool="label"] .ink .dimtext,
body.dragging-var .ink .dimtext{pointer-events:auto;cursor:pointer}
.overlay .handle{pointer-events:all;cursor:nwse-resize}
.overlay .handle-pt{pointer-events:all;cursor:grab;touch-action:none}
.overlay .handle-pt.rot{cursor:alias}
.overlay .handle-pt.insert{cursor:copy}
.qs-preview{animation:qsPulse .45s ease-out}
@keyframes qsPulse{from{opacity:.25}to{opacity:1}}

/* panel de propiedades de la figura editada */
#props{position:absolute;top:12px;right:262px;width:256px;max-height:calc(100% - 24px);overflow:auto;z-index:15;background:var(--chrome-2);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px}
body.no-vars #props{right:12px}
#props.left,body.no-vars #props.left{left:12px;right:auto}
#props[hidden]{display:none}
.pp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pp-head b{font-size:14px}
.pp-x{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.pp-sec{margin:10px 0 4px;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.pp-row{display:flex;align-items:center;gap:6px;margin:5px 0}
.pp-row>span:first-child{flex:1;min-width:0}
.pp-row input[type=number]{width:74px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--chrome);padding:0 6px;text-align:right}
.pp-row input[type=number]:disabled{opacity:.6}
.pp-row select{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--chrome);padding:0 4px;max-width:130px}
.pp-unit{width:22px;color:var(--muted)}
.pp-val{color:var(--muted);font-variant-numeric:tabular-nums}
.pp-link{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--chrome);cursor:pointer;padding:0;color:var(--muted)}
.pp-link.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pp-link .ic{width:15px;height:15px}
.pp-bind{margin:-2px 0 6px;padding-left:2px;font-size:11.5px;color:var(--accent)}
.pp-bind.bad{color:var(--danger)}
.pp-sw{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.pp-sw .sw{width:20px;height:20px}
.pp-actions{display:flex;gap:6px;margin-top:12px}
.pp-actions button{flex:1;border:1px solid var(--line);background:var(--chrome);border-radius:7px;padding:6px;cursor:pointer}
.pp-actions .danger{color:var(--danger)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.pp-row input.pp-text{width:140px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--chrome);padding:0 6px}
.pop-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* verificaciones, gráficas y tablas dentro de la hoja (colores de papel) */
.region.check-ok{border-color:#9ad3b0;background:#f1faf4}
.region.check-bad{border:1px solid #e3928c;background:#fff1f0}
.region.plot .view,.region.table .view{line-height:0}
.region.plot.editing .view{opacity:.85}
.plot-svg text{font-family:system-ui,"Segoe UI",sans-serif}
.plot-empty{line-height:1.4;color:#8a93a3;font-size:12px;padding:6px 2px}
.ctab{border-collapse:collapse;font-size:12px;line-height:1.35;color:#1d2129}
.ctab th,.ctab td{border:1px solid #c9ced6;padding:2px 8px;text-align:left;white-space:nowrap}
.ctab th{background:#eef2f8;font-weight:600}
.ctab td.num{text-align:right;font-variant-numeric:tabular-nums}
.ctab td.err{color:#c0281f}
.ctab tr.sum td{border-top:2px double #6b7280;font-weight:600}
.region.table .tbl-edit{display:none}
.region.table.editing .tbl-edit{display:block}
.region.table.editing .view{display:none}
.ctab.edit th,.ctab.edit td{padding:0}
.ctab.edit .cell{border:0;outline:0;padding:3px 6px;width:118px;font:12px system-ui,"Segoe UI",sans-serif;background:#fffdf2;color:#1d2129}
.ctab.edit .cell.head{font-weight:600;background:#eef2f8}
.ctab.edit .cell:focus{box-shadow:inset 0 0 0 2px #1f5fd1}
.tbl-bar{display:flex;gap:4px;align-items:center;margin-top:4px;font-size:11.5px;color:#4a5160;line-height:1.3}
.tbl-bar button{border:1px solid #c9ced6;background:#f6f7f9;border-radius:5px;padding:2px 7px;cursor:pointer;color:#1d2129}
.tbl-sum{margin-left:6px;display:flex;align-items:center;gap:3px}
.tbl-hint{font-size:10.5px;color:#8a93a3;margin-top:3px;line-height:1.3;white-space:normal;max-width:110mm}

/* pantalla de inicio (estilo Excel) */
#home{position:fixed;inset:0;z-index:45;display:grid;grid-template-columns:230px minmax(0,1fr);background:var(--bg);color:var(--text)}
#home[hidden]{display:none}
.home-nav{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px;min-height:0}
.home-brand{display:flex;align-items:center;gap:9px;font-size:17px;padding:4px 8px 18px}
.hn{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
.hn:hover{background:var(--chrome-2)}
.hn.on{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.hn .ic{width:19px;height:19px;flex:none}
.hn-sep{flex:1}
.home-ver{color:var(--muted);font-size:11px;padding:6px 12px}
.home-main{overflow:auto;padding:26px 44px 60px;min-width:0}
.home-main h1{font-size:26px;font-weight:600;margin:0 0 6px}
.home-main h2{font-size:18px;font-weight:600;margin:24px 0 12px}
.tpl-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.tpl{flex:none;width:156px;border:1px solid transparent;background:none;cursor:pointer;padding:10px 8px;border-radius:10px;text-align:center}
.tpl:hover{background:var(--chrome-2);border-color:var(--line)}
.tpl .pv{width:136px;height:104px;margin:0 auto 9px;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
.tpl b{display:block;font-size:13px;font-weight:500}
.tpl small{color:var(--muted);font-size:11.5px}
.pv{background:#fff;overflow:hidden}
.pv svg{width:100%;height:auto;display:block}
.rec-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.rec-card{border:1px solid var(--line);background:var(--chrome-2);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.rec-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.rec-card .hd{padding:10px 12px 9px;min-width:0}
.rec-card .hd small{color:var(--muted);display:block;font-size:11.5px}
.rec-card .hd b{display:block;font-size:14.5px;margin:3px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-card .pv{height:170px;border-top:1px solid var(--line)}
.home-bar{display:flex;align-items:center;gap:8px;margin:28px 0 6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--chrome-2);border-radius:18px;padding:6px 16px;cursor:pointer;font-size:14px}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.home-search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--chrome-2);border-radius:8px;padding:0 10px;height:36px;min-width:280px}
.home-search input{border:0;outline:0;background:none;flex:1;min-width:0}
.home-search .ic{width:17px;height:17px;color:var(--muted)}
.doc-list{width:100%;border-collapse:collapse;table-layout:fixed}
.doc-list th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.doc-list td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.doc-list tr.row{cursor:pointer}
.doc-list tr.row:hover td{background:var(--chrome-2)}
.doc-name{display:flex;align-items:center;gap:12px;min-width:0}
.doc-name>span:last-child{min-width:0}
.doc-ic{width:30px;height:36px;border-radius:4px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 15px Georgia,serif;flex:none;box-shadow:inset -6px -6px 0 rgba(255,255,255,.12)}
.doc-name b{font-weight:500;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-name small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-when{color:var(--muted);width:190px}
.doc-acts{width:116px;text-align:right}
.doc-acts button{border:0;background:none;cursor:pointer;color:var(--muted);padding:5px;border-radius:6px;line-height:0}
.doc-acts button:hover{background:var(--line);color:var(--text)}
.doc-acts .ic{width:17px;height:17px}
.doc-acts .pinned{color:#d79b00}
.doc-acts .pinned .ic{fill:currentColor}
tr.missing td{opacity:.5}
.home-empty{color:var(--muted);padding:18px 4px}
.recover{display:flex;align-items:center;gap:12px;border:1px solid #e0b252;background:#fff8e6;color:#5b4300;border-radius:10px;padding:10px 14px;margin:14px 0 0}
.recover button{margin-left:auto;border:1px solid #d1a03c;background:#fff;border-radius:7px;padding:5px 12px;cursor:pointer;color:#5b4300}
body.dark .recover{background:#3a2f12;color:#f3d9a4;border-color:#7a5d1d}
.scan-note{color:var(--muted);font-size:12px;margin-left:6px}
.lib-card{position:relative}
.lib-acts{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.lib-acts button{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--chrome-2);cursor:pointer;color:var(--muted);padding:0}
.lib-acts button.danger{color:var(--danger)}
.lib-acts .ic{width:17px;height:17px}
html,body,#viewport{overscroll-behavior:none}   /* sin «tirar para recargar» en la tablet */
@media (max-width:760px){
  #home{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .home-nav{flex-direction:row;overflow-x:auto;padding:6px}
  .home-brand,.hn-sep,.home-ver{display:none}
  .home-main{padding:16px}
  .home-search{min-width:0;width:100%}
  .doc-when{width:110px}
}

/* pie de página con rótulo y numeración */
.page-foot{position:absolute;left:15mm;right:15mm;bottom:6mm;display:flex;justify-content:space-between;gap:8mm;border-top:1px solid #aeb4be;
  padding-top:4px;font-size:10.5px;color:#4a5160;pointer-events:none;z-index:1;white-space:nowrap;overflow:hidden}
.page-foot[hidden]{display:none}

/* capas ocultas (tampoco se imprimen) */
#pages.hide-calc .region.math,#pages.hide-calc .region.plot,#pages.hide-calc .region.table,#pages.hide-text .region.text,
#pages.hide-ink .ink path.inkp,#pages.hide-highlight path.hlp,#pages.hide-sketch .g-shapes .shape:not(.img),#pages.hide-images .shape.img,#pages.hide-labels .g-labels{display:none}
.layer-list{display:flex;flex-direction:column;gap:2px}
.layer-row{display:grid;grid-template-columns:1fr auto auto;gap:4px;align-items:center}

/* menú Insertar */
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ins-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--chrome);border-radius:8px;padding:7px 9px;cursor:pointer;text-align:left}
.ins-item small{color:var(--muted);font-size:11px}
.ins-item.danger{color:var(--danger)}
body.sb-open #props.left{left:212px}
.ins-item:hover,.sym-btn:hover{border-color:var(--accent)}
.sym-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sym-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 2px;cursor:pointer;font-size:10.5px;color:#1d2129;line-height:1.2}
body[data-tool="symbol"] .page{cursor:crosshair}
.tb-glyph{font:600 18px/1 "Cambria Math",Cambria,Georgia,serif}
.symp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.symp{height:30px;border:1px solid transparent;border-radius:6px;background:var(--chrome);cursor:pointer;font:17px/1 "Cambria Math",Cambria,Georgia,serif;padding:0}
.symp:hover{border-color:var(--accent);background:var(--accent-soft)}
#pop:has(.symp-grid){max-height:calc(100vh - 110px);overflow:auto}

/* puntero láser */
.overlay .laser{stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;transition:opacity .9s ease}
.overlay .laser.fade{opacity:0}
body[data-tool="laser"] .page{cursor:none}
.pop-hint{color:var(--muted);font-size:11.5px;margin:4px 0 0}
.sel-tools{position:absolute;z-index:5;display:flex;gap:4px;align-items:center;background:#fff;border:1px solid #c4d3f3;border-radius:8px;
  padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:12px;color:#1d2129;transform:translateY(-100%)}
.sel-tools.below{transform:none}
.sel-tools[hidden]{display:none}   /* sin esto, display:flex gana al atributo hidden y la barra no se iría nunca */
.sel-tools span{padding:0 6px;color:#5f6674}
.sel-tools button{border:1px solid #d6d9df;background:#f6f7f9;border-radius:6px;padding:4px 8px;cursor:pointer}
.sel-tools button.danger{color:#c0281f}
.sel-tools button.close{padding:4px 7px;color:#5f6674}
.sel-tools button:hover{border-color:#2b6cff}
.sel-tools .sel-color{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px #b9c3d3;margin:0 2px}

/* escuadra y compás */
.overlay .geo-body{pointer-events:all;cursor:move;touch-action:none}
.overlay .geo-h{pointer-events:all;cursor:pointer;touch-action:none}
.overlay .geo-h[data-part=rotate],.overlay .geo-h[data-part=arm]{cursor:alias}
.overlay .geo-h[data-part=center]{cursor:move}
.overlay .geo text{user-select:none;pointer-events:none}

/* audio */
.sel-tools button.play{color:#1f5fd1;font-weight:600}
.au-row{display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:8px}
.au-row:hover{background:var(--chrome-3)}
.au-info{flex:1;min-width:0}
.au-info b{display:block;font-size:12.5px}
.au-info small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.danger{color:var(--danger)}
#player{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;padding:6px 8px;
  background:var(--chrome-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
#player input{width:260px;accent-color:var(--accent)}
.pl-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:84px;text-align:center}

/* barra personalizable */
.cust-list{max-height:min(60vh,520px);overflow:auto;margin:0 -4px;padding:0 4px}
.cust-row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 0}
.cust-row label{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.cust-row .ic{width:17px;height:17px;flex:none}
.cust-row .tb-glyph{font-size:15px;width:17px;text-align:center}
.cust-mv button{border:1px solid var(--line);background:var(--chrome);border-radius:5px;width:24px;height:22px;cursor:pointer;padding:0}
.cust-mv button:disabled{opacity:.3;cursor:default}

/* modo presentación */
body.presenting{grid-template-rows:minmax(0,1fr)}
body.presenting #appbar,body.presenting #toolbar,body.presenting #propbar,body.presenting #sidebar,body.presenting #vars,body.presenting #status,body.presenting #props,
body.presenting .page-num,body.presenting #player{display:none!important}
body.presenting #viewport{background:#0b0c0e;overflow:hidden}
body.presenting #pages{padding:12px;min-height:100%;justify-content:center;gap:0}
body.presenting .page{box-shadow:0 0 0 1px #222}
#presBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:2px;padding:5px;border-radius:14px;
  background:rgba(22,24,29,.88);color:#e6e8ec;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:opacity .4s}
#presBar .tb{color:#e6e8ec}
#presBar .tb:hover{background:rgba(255,255,255,.1);border-color:transparent}
#presBar .tb[aria-pressed="true"]{background:#7aa2ff;color:#0d1424;border-color:#7aa2ff}
#presBar .sep{width:1px;height:22px;background:rgba(255,255,255,.18);margin:0 4px}
#presNum{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
body.pres-idle #presBar{opacity:0}
body.pres-idle.presenting #viewport .page{cursor:none}

/* ventana invisible para exportar PNG: solo la hoja */
body.render-only{display:block;background:#fff}
body.render-only>*:not(#main):not(svg){display:none!important}   /* los <svg> sueltos guardan íconos y achurados */
body.render-only #sidebar,body.render-only #vars,body.render-only #props{display:none!important}
body.render-only #viewport{overflow:hidden}
body.render-only #pages{display:block;padding:0}
body.render-only .page{box-shadow:none}
body.render-only .page-num,body.render-only .overlay,body.render-only .crosshair,body.render-only .bg .grid{display:none!important}
body.render-only .region{border-color:transparent!important;background:transparent!important}

/* ---------- sensación de app nativa (tablet) ---------- */
html,body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{user-select:none;-webkit-user-select:none}
input,textarea,[contenteditable="true"]{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
#viewport{touch-action:none}
#appbar,#toolbar,#propbar{touch-action:pan-x}
.sb-body,.home-main,#varList,#pop,.cust-list,.home-nav{touch-action:pan-y}
button,select,label,.tb,.sw{touch-action:manipulation}
/* tinta en vivo: lienzo de alta densidad sobre la zona de trabajo */
#liveInk{position:fixed;pointer-events:none;z-index:30;display:none}
.overlay .laser{transition:none}

/* paleta flotante */
#quick{position:fixed;z-index:35;display:flex;align-items:center;gap:3px;padding:5px 6px;border-radius:16px;background:var(--chrome-2);border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(16,24,40,.22),0 2px 6px rgba(16,24,40,.12);user-select:none;-webkit-user-select:none;touch-action:none;max-width:calc(100vw - 16px);flex-wrap:wrap}
#quick.vertical{flex-direction:column;flex-wrap:nowrap;max-height:calc(100vh - 140px);overflow:auto}
#quick.dragging{opacity:.85;box-shadow:0 18px 40px rgba(16,24,40,.35)}
#quick .qgrip{width:14px;align-self:stretch;min-height:30px;border-radius:8px;cursor:grab;touch-action:none;
  background:radial-gradient(circle,var(--muted) 1.2px,transparent 1.5px) 0 0/7px 7px;opacity:.55}
#quick.vertical .qgrip{width:auto;height:14px;min-height:14px;align-self:stretch}
#quick .qb{width:40px;height:40px;display:grid;place-items:center;border:1px solid transparent;border-radius:11px;background:none;cursor:pointer;color:var(--text);padding:0}
#quick .qb:hover{background:var(--chrome-3)}
#quick .qb[aria-pressed="true"]{background:var(--accent);color:#fff}
body.dark #quick .qb[aria-pressed="true"]{color:#0d1424}
#quick .qb:disabled{opacity:.3}
#quick .qb .ic{width:21px;height:21px}
#quick .qc{width:30px;height:30px;border-radius:50%;border:3px solid var(--chrome-2);box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0;margin:0 1px}
#quick .qc[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
#quick .qw{width:36px;height:36px;display:grid;place-items:center;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;padding:0}
#quick .qw i{display:block;border-radius:50%;background:var(--text)}
#quick .qw[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
#quick .qz{min-width:54px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--chrome);cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
#quick .qsep{width:1px;height:26px;background:var(--line);margin:0 3px}
#quick.vertical .qsep{width:26px;height:1px;margin:3px 0}
#quick .qclose{width:30px;height:30px;color:var(--muted)}

/* modo oscuro inteligente: papel #121212, tinta negra → blanca, colores intactos, imágenes y PDF sin invertir (solo en pantalla) */
@media screen{
  body.dark .page{background:#121212;color:#e8e8e8;--paper:#121212}
  body.dark .page .k-fill{fill:#ececec}
  body.dark .page .k-stroke{stroke:#ececec}
  body.dark .page .hl{mix-blend-mode:normal;opacity:.7}
  body.dark .page .bg .grid{opacity:.4}
  body.dark .page .region .src{background:#2a2614;color:#f1f1f1}
  body.dark .page .region.editing{background:#1b1c1f}
  body.dark .page .region.text.editing{background:#1e1d18}
  body.dark .page .region.has-error{background:rgba(208,52,44,.14)}
  body.dark .page .region.dim-error{background:rgba(209,122,0,.14)}
  body.dark .page .region.check-ok{background:rgba(29,138,78,.16);border-color:#2f7a52}
  body.dark .page .region.check-bad{background:rgba(208,52,44,.16);border-color:#a3433d}
  body.dark .page .region .grip{background:#23314d;color:#b8c4dc}
  body.dark .page .ctab{color:#e8e8e8}
  body.dark .page .ctab th,body.dark .page .ctab td{border-color:#3a3f47}
  body.dark .page .ctab th,body.dark .page .ctab.edit .cell.head{background:#23262c}
  body.dark .page .ctab.edit .cell{background:#1e1d18;color:#eee}
  body.dark .page .tbl-bar{color:#b4bac4}
  body.dark .page .tbl-bar button{background:#23262c;border-color:#3a3f47;color:#e8e8e8}
  body.dark .page .page-foot{color:#9aa1ad;border-top-color:#3a3f47}
  body.dark .sb-thumb{background:#121212}
}

/* panel de variables */
#vars{width:250px;flex:none;border-left:1px solid var(--line);background:var(--chrome);display:flex;flex-direction:column;min-height:0}
#vars[hidden]{display:none}
.vh{padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line)}
.vh small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
#varList{overflow:auto;flex:1;padding:6px}
.var{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.var:hover{background:var(--chrome-2)}
.var .grab{color:var(--muted);font-size:12px}
.var .vv{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);padding:8px;margin:0}
.ghost{position:fixed;pointer-events:none;z-index:60;background:var(--accent);color:#fff;padding:3px 10px;border-radius:12px;
  transform:translate(-50%,-140%);box-shadow:var(--shadow);white-space:nowrap}

/* barra de estado, popovers, avisos */
#status{display:flex;align-items:center;gap:16px;height:28px;padding:0 12px;font-size:12px;color:var(--muted);background:var(--chrome);border-top:1px solid var(--line);
  white-space:nowrap;overflow:hidden}
#status .err{color:var(--danger);font-weight:600}
.st-spacer{flex:1}
#stTool{color:var(--text);font-weight:600}
#stRec{color:var(--danger);font-weight:600;font-variant-numeric:tabular-nums}
#zoomRange{width:110px;accent-color:var(--accent);cursor:pointer}
#pop{position:fixed;z-index:50;width:280px;max-width:calc(100vw - 16px);background:var(--chrome-2);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);padding:10px}
#pop[hidden]{display:none}
.pop-title{font-weight:600;margin-bottom:8px}
.pop-vars{display:flex;flex-wrap:wrap;gap:5px;max-height:180px;overflow:auto;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--chrome);border-radius:14px;padding:3px 10px;cursor:pointer}
.chip.on,.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;color:var(--muted)}
.pop-row select,.pop-row input{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--chrome);padding:0 6px}
.pop-row input[type=range]{border:0;background:none;padding:0;height:auto}
.pop-row input[type=checkbox]{flex:none;width:18px;height:18px}
.pop-row .rng-wrap{flex:1;justify-content:flex-end}
.pop-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}
.pop-actions button{border:1px solid var(--line);background:var(--chrome);border-radius:6px;padding:5px 10px;cursor:pointer}
.pop-actions .danger{color:var(--danger);margin-right:auto}
#pop ul{margin:0;padding-left:18px}
#pop li{margin:3px 0}
#pop kbd{font:11px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--chrome)}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#1d2129;color:#fff;padding:7px 14px;border-radius:8px;
  font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
#toast.show{opacity:.92}
.fatal{padding:16px;background:#fde8e7;color:#8c1d16}

@media (max-width:1100px){
  #docTitle{width:150px}
  #stInput{display:none}
}
@media (max-width:760px){
  #toolbar{flex-wrap:nowrap;overflow-x:auto}
  #appbar{overflow-x:auto}
  .doc-id{flex:none}
  #docTitle{width:110px}
  #saveState,.zoomctl,#stPos,#zoomRange{display:none}
  #vars{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:var(--shadow)}
  #sidebar{position:absolute;left:0;top:0;bottom:0;z-index:20;box-shadow:var(--shadow)}
  #props,#props.left,body.no-vars #props,body.no-vars #props.left{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:46%}
}

/* ---------- impresión / PDF: siempre tema claro, sin cuadrícula ni controles ---------- */
@media print{
  html,body{height:auto;overflow:visible;display:block;background:#fff}
  #appbar,#toolbar,#propbar,#sidebar,#status,#vars,#pop,#toast,#props,.page-num,.overlay,.crosshair,.sel-tools,.region .grip,.rec-dot{display:none!important}
  #main,#viewport{display:block;overflow:visible}
  #pages{display:block;padding:0}
  .page-holder{width:var(--pw)!important;height:var(--ph)!important;break-after:page;page-break-after:always}
  .page-holder:last-child{break-after:auto;page-break-after:auto}
  .page{transform:none!important;box-shadow:none;filter:none!important}
  .bg .grid{display:none}
  .region{border-color:transparent!important;background:transparent!important}
}
</style>

<!-- barra de aplicación: archivo, deshacer, páginas, zoom y vista -->
<header id="appbar">
  <button class="logo-btn" data-act="home" data-cust="home" title="Inicio: documentos y plantillas (Ctrl+Mayús+H)"><span class="logo">Σ</span></button>
  <div class="doc-id">
    <input id="docTitle" aria-label="Título del documento" spellcheck="false">
    <span id="saveState">Sin guardar</span>
  </div>
  <div class="ab-grp">
    <button class="tb" data-act="new" data-cust="new" title="Nuevo documento (Ctrl+N)"><svg class="ic"><use href="#i-new"/></svg></button>
    <button class="tb" data-act="open" data-cust="open" title="Abrir documento (Ctrl+O)"><svg class="ic"><use href="#i-open"/></svg></button>
    <button class="tb" data-act="save" data-cust="save" title="Guardar (Ctrl+S) · Guardar como (Ctrl+Mayús+S)"><svg class="ic"><use href="#i-save"/></svg></button>
    <button class="tb" data-act="importPdf" data-cust="importPdf" title="Anotar un PDF: cada página del PDF pasa a ser una hoja para escribir encima"><svg class="ic"><use href="#i-annot"/></svg></button>
    <button class="tb" data-act="pdf" data-cust="pdf" title="Exportar memoria a PDF (Ctrl+P)"><svg class="ic"><use href="#i-pdf"/></svg></button>
    <button class="tb" data-act="export" data-cust="export" title="Exportar la página a PNG o SVG"><svg class="ic"><use href="#i-export"/></svg></button>
  </div>
  <div class="ab-grp">
    <button class="tb" data-act="undo" title="Deshacer (Ctrl+Z · toque con 2 dedos)"><svg class="ic"><use href="#i-undo"/></svg></button>
    <button class="tb" data-act="redo" title="Rehacer (Ctrl+Y · toque con 3 dedos)"><svg class="ic"><use href="#i-redo"/></svg></button>
  </div>
  <div class="ab-spacer"></div>
  <div class="ab-grp pagenav" aria-label="Páginas">
    <button class="tb sm" data-act="prevPage" title="Página anterior (Re Pág)"><svg class="ic"><use href="#i-chev-l"/></svg></button>
    <span id="pageInfo">1 / 1</span>
    <button class="tb sm" data-act="nextPage" title="Página siguiente (Av Pág)"><svg class="ic"><use href="#i-chev-r"/></svg></button>
  </div>
  <div class="ab-grp zoomctl">
    <button class="tb sm" data-act="zoomOut" title="Alejar (Ctrl −)"><svg class="ic"><use href="#i-zout"/></svg></button>
    <button id="zoomLbl" data-act="resetView" title="Restablecer la vista (ancho de página, centrada) · clic derecho: más opciones de zoom">100%</button>
    <button class="tb sm" data-act="zoomIn" title="Acercar (Ctrl +)"><svg class="ic"><use href="#i-zin"/></svg></button>
  </div>
  <div class="ab-grp">
    <button class="tb" data-act="record" data-cust="record" title="Grabar audio de la clase junto con las notas"><svg class="ic"><use href="#i-mic"/></svg></button>
    <button class="tb" data-act="present" data-cust="present" title="Modo presentación (F5)"><svg class="ic"><use href="#i-present"/></svg></button>
    <button class="tb" data-toggle="showQuick" title="Paleta flotante para tablet: lápiz, colores, grosores, deshacer y zoom"><svg class="ic"><use href="#i-palette"/></svg></button>
    <button class="tb" data-toggle="showPages" title="Panel de páginas y capas"><svg class="ic"><use href="#i-sidebar"/></svg></button>
    <button class="tb" data-toggle="showVars" title="Panel de variables"><svg class="ic"><use href="#i-vars"/></svg></button>
    <button class="tb" data-toggle="dark" title="Modo oscuro (no afecta la exportación)"><svg class="ic"><use href="#i-moon"/></svg></button>
    <button class="tb" data-act="customize" title="Personalizar la barra de herramientas"><svg class="ic"><use href="#i-sliders"/></svg></button>
    <button class="tb" data-act="help" title="Ayuda y atajos"><svg class="ic"><use href="#i-help"/></svg></button>
  </div>
</header>

// Lee el archivo, lo reduce a un tamaño razonable (máx. 1600 px) y lo guarda como data URL dentro del documento.
function loadImageFile(blob) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(u);
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k) });
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      let src = c.toDataURL('image/png');
      if (src.length > 900000) {   // fotos o capturas muy grandes: JPEG sobre fondo blanco, mucho más liviano
        ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        src = c.toDataURL('image/jpeg', 0.86);
      }
      res({ src, w: c.width, h: c.height, natW: img.naturalWidth, natH: img.naturalHeight });
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('El archivo no es una imagen válida')); };
    img.src = u;
  });
}
async function insertImageFile(blob, at = null) {

document.addEventListener('paste', e => {

  const dt = e.clipboardData, text = dt?.getData('text/plain');

async function importPdf(file) {

  let mode = 'new';
  if (!empty) mode = confirm(`¿Crear un documento nuevo con «${file.name}»?\n\nAceptar = documento nuevo · Cancelar = añadir sus páginas al final del documento actual`) ? 'new' : 'append';

    const pages = [];

      const c = E('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);

    }

  } catch (err) { console.error(err); alert('No se pudo abrir el PDF: ' + (err.message || err)); }

    commit(before); if (sbTab === 'audio') renderSidebar();

// En la tablet: el SVG de la página se dibuja en un lienzo y se descarga como PNG
async function webPng(pgId, k, name) {
  try {
    const { w, h } = pdim(pgId), img = new Image();
    const url = URL.createObjectURL(new Blob([pageSvg(pgId)], { type: 'image/svg+xml' }));
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('no se pudo dibujar la página')); img.src = url; });
    const c = E('canvas'); c.width = Math.round(w * MM * k); c.height = Math.round(h * MM * k);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(res => c.toBlob(res, 'image/png'));
    const a = E('a', { href: URL.createObjectURL(blob), download: name + '.png' });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('Imagen PNG descargada');
  } catch (e) { toast('No se pudo crear el PNG: ' + (e.message || e) + ' · pruebe con SVG o PDF'); }
}
function downloadText(text, name, type) {
  const a = E('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
// SVG autónomo: fondo, tinta, figuras y etiquetas como vectores; regiones como HTML/MathML en foreignObject
function pageSvg(pgId) {
  const P = pageDom.get(pgId), { w, h } = pdim(pgId), pg = pageOf(pgId), XH = 'http://www.w3.org/1999/xhtml';
  const svg = S('svg', { xmlns: SVGNS, width: w + 'mm', height: h + 'mm', viewBox: `0 0 ${w} ${h}` });
  const defs = S('defs');
  document.querySelectorAll('svg defs pattern[id^="hatch-"]').forEach(p => defs.append(p.cloneNode(true)));
  P.page.querySelectorAll('.ink defs filter').forEach(f => defs.append(f.cloneNode(true)));
  svg.append(defs, S('rect', { width: w, height: h, fill: '#fff' }));
  if (pg.pdf) svg.append(S('image', { href: assetUrl(pg.pdf.asset), width: w, height: h, preserveAspectRatio: 'none' }));
  const visible = k => !layerState(k).hidden;
  if (visible('highlight')) svg.append(P.hl.cloneNode(true));
  const ink = S('g');
  for (const g of [P.shapes, P.strokes, P.labels]) {
    const c = g.cloneNode(true);
    if (g === P.strokes && !visible('ink')) c.querySelectorAll('.inkp').forEach(n => n.remove());
    if (g === P.strokes && !visible('highlight')) c.querySelectorAll('.hlp').forEach(n => n.remove());
    if (g === P.shapes && !visible('sketch')) c.querySelectorAll('.shape:not(.img)').forEach(n => n.remove());
    if (g === P.shapes && !visible('images')) c.querySelectorAll('.shape.img').forEach(n => n.remove());
    if (g === P.labels && !visible('labels')) continue;
    ink.append(c);
  }
  svg.append(ink);
  for (const r of doc.regions) {
    if (r.pageId !== pgId || !visible(r.type === 'text' ? 'text' : 'calc')) continue;
    const el = regionEls.get(r.id); if (!el) continue;
    const b = regionBox(r), fo = S('foreignObject', { x: r2(r.x), y: r2(r.y), width: r2(b.x1 - b.x0 + 4), height: r2(b.y1 - b.y0 + 2) });
    const div = document.createElementNS(XH, 'div');
    const tx = r.type === 'text' ? `font-family:${fontCss(r.font)};font-size:${r2(textPt(r) * 4 / 3 / MM * 100) / 100}px;font-weight:${r.bold ? 700 : 400};font-style:${r.italic ? 'italic' : 'normal'};text-decoration:${r.underline ? 'underline' : 'none'};text-align:${r.align || 'left'};${r.w ? `width:${r.w}mm;` : ''}color:${r.color || '#1d2129'}`
      : 'font:3.6px system-ui,"Segoe UI",sans-serif;color:#1d2129';
    div.setAttribute('style', `${tx};white-space:pre-wrap;transform:scale(${r.scale || 1});transform-origin:0 0`);
    if (r.type === 'text') { if (r.w) fo.setAttribute('width', r2(r.w + 2)); if (r.html) div.innerHTML = cleanRich(r.html); else div.textContent = r.source; }
    else if (r.type === 'plot') { const s = el._view.querySelector('svg')?.cloneNode(true); if (s) { s.setAttribute('width', r2(s.getAttribute('width') / MM)); s.setAttribute('height', r2(s.getAttribute('height') / MM)); div.append(s); } }
    else if (r.type === 'table') { const t = el._view.querySelector('table')?.cloneNode(true); if (t) { t.setAttribute('style', 'border-collapse:collapse;font-size:3.2px'); t.querySelectorAll('td,th').forEach(c => c.setAttribute('style', 'border:0.2px solid #9aa1ad;padding:0.4px 2px')); div.append(t); } }
    else { const m = el._view.querySelector('.katex-mathml math')?.cloneNode(true); if (m) { m.setAttribute('style', 'font-size:4px'); div.append(m); } else div.textContent = r.source; }
    fo.append(div); svg.append(fo);
  }

}

function renderThumb(d, w = 150, h = 92) {   // como en Excel: se ve la esquina superior de la primera página, ampliada
  const pg = d.pages?.[0]?.id, svg = S('svg', { viewBox: `8 4 ${w} ${h}`, preserveAspectRatio: 'xMinYMin slice' });
  svg.append(S('rect', { width: 210, height: 297, fill: '#fff' }));
  const bgType = d.settings?.background?.type;
  if (bgType === 'grid') {
    let p = ''; for (let x = 10; x < 210; x += 10) p += `M${x} 0V297`; for (let y = 10; y < 297; y += 10) p += `M0 ${y}H210`;
    svg.append(S('path', { d: p, stroke: '#dbe6f3', 'stroke-width': 0.5, fill: 'none' }));
  } else if (bgType === 'dots') {
    let p = ''; for (let x = 10; x < 210; x += 10) p += `M${x} 0V297`;
    svg.append(S('path', { d: p, stroke: '#9cb3cc', 'stroke-width': 1.3, 'stroke-linecap': 'round', 'stroke-dasharray': '0 10', fill: 'none' }));
  }
  for (const s of d.strokes || []) if (s.pageId === pg && s.tool === 'highlighter' && s.points?.length)
    svg.append(S('polyline', { points: s.points.map(p => p[0] + ',' + p[1]).join(' '), fill: 'none', stroke: s.color, 'stroke-width': s.width, 'stroke-opacity': 0.45 }));
  for (const sh of d.shapes || []) if (sh.pageId === pg) { try { svg.append(shapeEl(sh)); } catch { /* figura desconocida */ } }
  for (const r of d.regions || []) {
    if (r.pageId !== pg) continue;
    if (r.type === 'table') {
      const rows = r.table?.rows || [];
      rows.forEach((row, i) => row.forEach((c, j) => svg.append(S('rect', { x: r.x + j * 26, y: r.y + i * 6, width: 26, height: 6, fill: i ? '#fff' : '#eef2f8', stroke: '#c9ced6', 'stroke-width': 0.3 }),
        S('text', { x: r.x + j * 26 + 1.2, y: r.y + i * 6 + 4.2, 'font-size': 3.2, fill: '#1d2129', 'font-family': 'system-ui,sans-serif' }, String(c).slice(0, 12)))));
    } else if (r.type === 'plot') {
      svg.append(S('rect', { x: r.x, y: r.y + 3, width: 125, height: 30, fill: 'none', stroke: '#c9ced6', 'stroke-width': 0.4 }),
        S('path', { d: `M${r.x} ${r.y + 33}Q${r.x + 62} ${r.y - 12} ${r.x + 125} ${r.y + 33}`, fill: '#1f5fd122', stroke: '#1f5fd1', 'stroke-width': 0.8 }));
    } else svg.append(S('text', { x: r.x + 1, y: r.y + 4.5, 'font-size': r.type === 'text' ? r2(textPt(r) * 0.37) : 3.8, 'font-weight': r.bold ? 700 : null, fill: r.color || '#1d2129',
      'font-style': r.type === 'math' || r.italic ? 'italic' : null, 'font-family': r.type === 'math' ? 'Cambria,Georgia,serif' : fontCss(r.font) }, (r.source || '').split('\n')[0].slice(0, 64)));
  }
  for (const s of d.strokes || []) if (s.pageId === pg && s.tool !== 'highlighter' && s.points?.length)
    svg.append(S('polyline', { points: s.points.map(p => p[0] + ',' + p[1]).join(' '), fill: 'none', stroke: s.color, 'stroke-width': Math.max(0.45, s.width), 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  return svg;
}
function whenText(ms) {
  if (!ms) return '—';
  const d = new Date(ms), now = new Date(), mins = (now - d) / 60000, day = 86400000;
  if (mins < 1) return 'Hace un momento';
  if (mins < 60) return `Hace ${Math.round(mins)} min`;
  const t = d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' }), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (ms >= today) return `Hoy a las ${t}`;
  if (ms >= today - day) return `Ayer a las ${t}`;
  if (ms >= today - 6 * day) return `${d.toLocaleDateString('es-CO', { weekday: 'short' })} a las ${t}`;
  return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', ...(d.getFullYear() !== now.getFullYear() ? { year: 'numeric' } : {}) });
}
const prettyDir = p => p.replace(/[\\/][^\\/]*$/, '').replace(/^[A-Za-z]:[\\/]Users[\\/][^\\/]+[\\/]?/i, '').split(/[\\/]/).filter(Boolean).join(' » ');
const fold = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
// Todos los documentos conocidos: recientes (con título y fecha de apertura) + los encontrados en el equipo.
function allDocs() {
  const map = new Map();
  for (const r of recentDocs) map.set(r.path.toLowerCase(), { ...r });
  for (const f of foundDocs || []) {
    const k = f.path.toLowerCase();
    if (map.has(k)) map.get(k).mtime ??= f.mtime;
    else map.set(k, { path: f.path, title: baseName(f.path).replace(/\.calcink$/i, ''), mtime: f.mtime, exists: true, found: true });
  }
  return [...map.values()];
}
async function peekDoc(entry) {
  if (!desktop || !entry.exists) return null;
  const key = entry.path + '|' + entry.mtime;
  if (docCache.has(key)) return docCache.get(key);
  const p = desktop.peek(entry.path).then(text => { try { const d = JSON.parse(text); return d.format === 'calcink' ? d : null; } catch { return null; } });
  docCache.set(key, p);
  return p;
}
function showHome() {
  finishEditing(); hidePopover(); clearSelection();
  home.hidden = false; renderQuick();
  renderHome();
  refreshHomeData();
}
function hideHome() { home.hidden = true; renderQuick(); }
async function refreshHomeData(forceScan = false) {
  if (!desktop) return;
  recentDocs = await desktop.recentList();
  renderHomeDocs();
  if ((foundDocs && !forceScan) || scanning) return;
  scanning = true; renderHomeDocs();
  try { foundDocs = await desktop.scanDocs(forceScan); } catch { foundDocs = []; }
  scanning = false; renderHomeDocs();
}
async function openFromHome(p) {
  if (dirty && !confirm(`Hay cambios sin guardar en «${doc.meta.title}». ¿Abrir otro documento? (Puede volver con Deshacer)`)) return;
  try { const f = await desktop.openPath(p); loadDocText(f.text, f.path); }
  catch (e) { alert('No se pudo abrir el documento:\n' + p + '\n\n' + (e.message || e)); refreshHomeData(); }
}
function newFromTemplate(t) {
  if (dirty && desktop && !confirm(`Hay cambios sin guardar en «${doc.meta.title}». ¿Crear otro documento? (Puede volver con Deshacer)`)) return;
  startFresh(t.make()); setZoom(fitZoom() < 1 ? fitZoom() : 1);
}
function renderHome() {
  const navBtn = (icon, label, fn, on = false) => {
    const b = E('button', { class: 'hn' + (on ? ' on' : '') }, label);
    b.insertAdjacentHTML('afterbegin', `<svg class="ic"><use href="#${icon}"/></svg>`);
    b.addEventListener('click', fn); return b;
  };
  const hasDoc = doc.regions.length + doc.strokes.length + doc.shapes.length > 0 || filePath;
  const nav = E('nav', { class: 'home-nav' },
    E('div', { class: 'home-brand' }, E('span', { class: 'logo' }, 'Σ'), E('b', {}, 'CalcInk')),
    hasDoc ? navBtn('i-back', 'Volver al documento', hideHome) : '',
    navBtn('i-home', 'Inicio', () => $('#homeMain').scrollTo({ top: 0, behavior: 'smooth' }), true),
    navBtn('i-new', 'Nuevo', () => newFromTemplate(TEMPLATES[0])),
    navBtn('i-open', 'Abrir…', openFile),
    E('div', { class: 'hn-sep' }),
    navBtn('i-help', 'Ayuda', e => { hideHome(); showHelp(innerWidth / 2 - 170, 90); }),
    E('div', { class: 'home-ver' }, appVersion ? `CalcInk ${appVersion}` : 'CalcInk'));
  const h = new Date().getHours();
  const greet = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  const tpls = E('div', { class: 'tpl-row' }, ...TEMPLATES.map(t => {
    const b = E('button', { class: 'tpl', title: 'Crear: ' + t.name }, E('div', { class: 'pv' }, renderThumb(t.make(), 150, 115)), E('b', {}, t.name), E('small', {}, t.sub));
    b.addEventListener('click', () => newFromTemplate(t)); return b;
  }));
  const recover = dirty && hasDoc && desktop ? E('div', { class: 'recover' }, `Tienes cambios sin guardar en «${doc.meta.title}».`, E('button', { onclick: hideHome }, 'Volver a ese documento')) : '';
  const main = E('main', { class: 'home-main', id: 'homeMain' }, E('h1', {}, greet), recover, E('h2', {}, 'Nuevo'), tpls, E('div', { id: 'homeDocs' }));
  home.replaceChildren(nav, main);
  renderHomeDocs();
}
function renderHomeDocs() {
  const box = $('#homeDocs'); if (!box) return;
  if (!desktop) return renderLibraryDocs(box);
  const all = allDocs();
  const recent = recentDocs.filter(r => r.exists).sort((a, b) => (b.pinned - a.pinned) || ((Date.parse(b.opened) || 0) - (Date.parse(a.opened) || 0)));
  // tarjetas grandes con vista previa (como «Recomendado para ti» en Excel)
  const cardsSrc = (recent.length ? recent : all.filter(d => d.exists).sort((a, b) => (b.mtime || 0) - (a.mtime || 0))).slice(0, 4);
  const cards = E('div', { class: 'rec-cards' }, ...cardsSrc.map(entry => {
    const pv = E('div', { class: 'pv' }), title = E('b', {}, entry.title);
    const card = E('button', { class: 'rec-card', title: entry.path },
      E('div', { class: 'hd' }, E('small', {}, entry.opened ? (entry.pinned ? '★ Fijado' : 'Abierto recientemente') : 'En este equipo'), title,
        E('small', {}, entry.opened ? whenText(Date.parse(entry.opened)) : whenText(entry.mtime))), pv);
    card.addEventListener('click', () => openFromHome(entry.path));
    peekDoc(entry).then(d => { if (d) { pv.append(renderThumb(d)); if (d.meta?.title) title.textContent = d.meta.title; } });
    return card;
  }));
  // lista con pestañas y búsqueda
  let list = homeTab === 'pinned' ? recent.filter(r => r.pinned) : homeTab === 'all' ? all.filter(d => d.exists).sort((a, b) => (b.mtime || 0) - (a.mtime || 0)) : recent;
  if (homeQuery) { const q = fold(homeQuery); list = list.filter(d => fold(d.title).includes(q) || fold(d.path).includes(q)); }
  const pill = (id, label) => E('button', { class: 'pill' + (homeTab === id ? ' on' : ''), onclick: () => { homeTab = id; renderHomeDocs(); } }, label);
  const search = E('input', { type: 'search', placeholder: 'Buscar un documento', value: homeQuery });
  search.addEventListener('input', () => { homeQuery = search.value; renderHomeDocs(); const s = $('#homeDocs input[type=search]'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); });
  const searchBox = E('label', { class: 'home-search' }, search); searchBox.insertAdjacentHTML('afterbegin', '<svg class="ic"><use href="#i-search"/></svg>');
  const act = (icon, title, fn, cls = '') => { const b = E('button', { title, class: cls }); b.innerHTML = `<svg class="ic"><use href="#${icon}"/></svg>`; b.addEventListener('click', e => { e.stopPropagation(); fn(); }); return b; };
  const rows = list.slice(0, 120).map(entry => {
    const name = E('b', {}, entry.title);
    peekDoc(entry).then(d => { if (d?.meta?.title) name.textContent = d.meta.title; });
    const tr = E('tr', { class: 'row' + (entry.exists === false ? ' missing' : ''), title: entry.path },
      E('td', {}, E('div', { class: 'doc-name' }, E('span', { class: 'doc-ic' }, 'Σ'), E('span', {}, name, E('small', {}, prettyDir(entry.path))))),
      E('td', { class: 'doc-when' }, whenText(entry.mtime)),
      E('td', { class: 'doc-acts' },
        act('i-star', entry.pinned ? 'Quitar de fijados' : 'Fijar arriba', async () => { await desktop.recentPin(entry.path, !entry.pinned); refreshHomeData(); }, entry.pinned ? 'pinned' : ''),
        act('i-open', 'Mostrar en la carpeta', () => desktop.reveal(entry.path)),
        entry.opened !== undefined && !entry.found ? act('i-x', 'Quitar de la lista (no borra el archivo)', async () => { await desktop.recentRemove(entry.path); refreshHomeData(); }) : ''));
    tr.addEventListener('click', () => openFromHome(entry.path));
    return tr;
  });
  const empty = homeTab === 'pinned' ? 'No hay documentos fijados. Use la estrella ☆ de cualquier documento.'
    : homeTab === 'all' ? (scanning ? 'Buscando documentos .calcink en Documentos, Escritorio, Descargas y OneDrive…' : 'No se encontraron documentos .calcink.')
    : 'Todavía no hay documentos recientes. Cree uno nuevo o use «Abrir…».';
  box.replaceChildren(
    cardsSrc.length ? E('h2', {}, recent.length ? 'Recientes' : 'Documentos en este equipo') : '', cardsSrc.length ? cards : '',
    E('div', { class: 'home-bar' }, pill('recent', 'Recientes'), pill('pinned', 'Fijados'), pill('all', `En este equipo${foundDocs ? ` (${allDocs().filter(d => d.exists).length})` : ''}`),
      scanning ? E('span', { class: 'scan-note' }, 'buscando…') : '', searchBox),
    rows.length ? E('table', { class: 'doc-list' }, E('thead', {}, E('tr', {}, E('th', {}, 'Nombre'), E('th', { class: 'doc-when' }, 'Fecha de modificación'), E('th', { class: 'doc-acts' }, ''))), E('tbody', {}, ...rows))
      : E('p', { class: 'home-empty' }, homeQuery ? `Sin resultados para «${homeQuery}».` : empty));
}

// ---------- arranque ----------
loadPrefs();
doc = loadInitial();
applyToolbarPrefs();
syncToggles();
setTool('select');
buildPages();
setZoom(fitZoom() < 1 ? fitZoom() : 1);
updateUndoButtons();
// páginas de PDF y audio de la sesión anterior (guardados en IndexedDB)
if (docAssetIds(doc).length) loadAssets(docAssetIds(doc)).then(() => { if (doc.pages.some(p => p.pdf)) buildPages(); });
if (desktop && !RENDER_ONLY) {
  desktop.setDirty(dirty);
  desktop.onOpenFile(f => loadDocText(f.text, f.path));
  desktop.onMenu(cmd => {
    if (cmd === 'save-then-close') return saveFile().then(ok => { if (ok) desktop.closeNow(); });
    if (cmd === 'help') return showHelp(innerWidth / 2 - 170, 90);
    if (cmd === 'dark' || cmd === 'vars') { const key = cmd === 'dark' ? 'dark' : 'showVars'; state[key] = !state[key]; savePrefs(); return syncToggles(); }
    // portapapeles desde el menú: texto si hay un campo enfocado; si no, elementos de la hoja
    if (['copy', 'cut', 'paste'].includes(cmd) && isTextEntry(document.activeElement))
      return document.execCommand(cmd);
    if (!home.hidden && !['home', 'open', 'new', 'save', 'saveAs', 'dark', 'vars', 'importPdf', 'customize'].includes(cmd)) hideHome();   // el resto actúa sobre el documento
    actions[cmd]?.();
  });
}
document.fonts?.ready.then(() => { if (state.selection) renderSelection(); });
// Al abrir la app se muestra la pantalla de inicio, salvo que se haya abierto con doble clic en un .calcink.
if (RENDER_ONLY) { /* ventana invisible de exportación: la controla calcinkRenderOnly */ }
else if (desktop) desktop.launchInfo().then(i => { appVersion = i.version; if (!i.launchedWithFile) showHome(); });
else {
  showHome();
  // app instalable: funciona sin conexión (service worker) y pide que el navegador no borre los documentos
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { /* sin sw.js en desarrollo */ });
  navigator.storage?.persist?.().catch(() => {});
  addEventListener('pagehide', () => { if (dirty) { clearTimeout(libT); libSave(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && dirty) { clearTimeout(libT); libSave(); } });
}
</script>
